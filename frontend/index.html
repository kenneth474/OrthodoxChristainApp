<!doctype html>
<!--
  The one HTML page of the React app. React draws everything inside
  <div id="root">; src/main.tsx is where it starts.

  The <meta> and <link> tags below make the app feel native on a phone: when
  you choose "Add to Home Screen" on an iPhone, it gets the gold cross icon,
  opens full screen without Safari's address bar, and keeps its own name.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone's notch and home bar
         (the CSS keeps text clear of them with env(safe-area-inset-...)). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Orthodox Daily</title>
    <meta name="description" content="Daily readings, saints, fasting, the Bible and prayers for Antiochian Orthodox Christians." />

    <link rel="icon" type="image/png" href="/icons/icon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f3ecdd" />

    <!-- iPhone home-screen app -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Orthodox Daily" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Apply your saved style, light/dark choice and text size BEFORE anything
         is drawn, so the page never flashes the wrong colors
         (src/lib/appearance.ts keeps this copy up to date and does the rest). -->
    <script>
      (function () {
        var root = document.documentElement;
        var saved = {};
        try {
          saved = JSON.parse(localStorage.getItem('orthodoxDaily.appearance') || 'null') || {};
        } catch (e) {}
        var theme = saved.theme || 'SYSTEM';
        var deviceDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = theme.toLowerCase();
        // Candlelit vigil is always dark.
        root.dataset.mode = saved.style === 'VIGIL' || theme === 'DARK' || (theme === 'SYSTEM' && deviceDark) ? 'dark' : 'light';
        root.dataset.style = (saved.style || 'ILLUMINATED').toLowerCase();
        root.dataset.season = saved.season || 'ordinary';
        root.dataset.textSize = (saved.textSize || 'NORMAL').toLowerCase();
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
