<!DOCTYPE html>
<!--
  PRAYERS TAB  (http://localhost:8080/prayers.html)
  -----------
  An Orthodox prayer book: morning and evening prayers, the Creed, prayers
  before and after meals and Communion, for the departed, and more.

  The prayers themselves live in a data file, data/prayers.json, so adding or
  correcting a prayer never means touching this page's code. Each section
  there has "items", and each item is one of:
      { "title": "...", "lines": [ ... ] }   prayers, line by line
      { "scripture": { "book": "PSA", "chapter": 50, "from": 3 } }
                                             a Psalm, loaded from the Bible tab's text
      { "include": "trisagion" }             another whole section, e.g. the
                                             Beginning Prayers inside Morning Prayers
  A line can be plain text, { "text": "...", "times": 3 } for a prayer said
  three times, or { "rubric": "..." } for an instruction (shown in italics,
  not read aloud).

  Like the Bible tab, the part of the address after # picks the view:
      prayers.html            -> the list of sections
      prayers.html#morning    -> Morning Prayers
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prayers · Orthodox Daily</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/reading.css">
    <script src="/js/appearance.js"></script>
    <script src="/js/tabs.js" defer></script>
</head>
<body>
<main>
    <h1>Prayer Book</h1>
    <p class="subtitle" id="about"></p>

    <div id="view"><p class="status">Opening the prayer book…</p></div>
</main>

<script src="/js/listen.js"></script>
<script>
    const view = document.getElementById('view');
    let book;                 // the whole prayer book, from data/prayers.json
    const psalmCache = {};    // chapters already loaded from /api/bible, so each is fetched once

    // ---- Small helpers ----
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text ?? '';
        return div.innerHTML;
    }

    const TIMES = { 2: 'Twice', 3: 'Three times', 12: 'Twelve times' };
    function timesLabel(n) {
        return TIMES[n] ?? `${n} times`;
    }

    async function getJson(url) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Couldn't load the prayers (status ${response.status}).`);
        return response.json();
    }

    // Replaces each { "include": "id" } with that section's items, so Morning
    // Prayers contains the Beginning Prayers, the Creed and so on. "seen"
    // stops a section from (accidentally) including itself forever.
    function expand(items, seen = new Set()) {
        return items.flatMap(item => {
            if (!item.include) return [item];
            if (seen.has(item.include)) return [];
            const section = book.sections.find(s => s.id === item.include);
            if (!section) return [];
            const inner = expand(section.items, new Set([...seen, item.include]));
            // An included section's own title becomes the heading of its first item.
            return inner.map((innerItem, i) =>
                i === 0 && !innerItem.title ? { ...innerItem, title: section.title } : innerItem);
        });
    }

    // Loads the verses for a scripture item, e.g. Psalm 50 from verse 3.
    async function scriptureVerses(ref) {
        const key = `${ref.book}.${ref.chapter}`;
        psalmCache[key] ??= await getJson(`/api/bible/${ref.book}/${ref.chapter}`);
        return psalmCache[key].verses.filter(v => {
            const n = parseInt(v.number, 10);
            return n >= (ref.from ?? 1) && n <= (ref.to ?? Infinity);
        });
    }

    // ---- View 1: the list of sections ----
    function showList() {
        const listed = book.sections.filter(s => s.listed !== false);
        view.innerHTML = listed.map(section => `
            <a class="card" style="display:block;text-decoration:none;color:inherit" href="#${section.id}">
                <strong>${escapeHtml(section.title)}</strong> <span style="color:var(--gold)">›</span>
                ${section.note ? `<div class="rubric">${escapeHtml(section.note)}</div>` : ''}
            </a>`).join('');
    }

    // ---- View 2: one section ----
    async function showSection(id) {
        const section = book.sections.find(s => s.id === id);
        if (!section) return showList();
        view.innerHTML = '<p class="status">Loading…</p>';

        // Build the page and, alongside it, the words to read aloud.
        let html = '';
        const spoken = [section.title];

        for (const item of expand(section.items)) {
            if (item.title) {
                html += `<h3>${escapeHtml(item.title)}</h3>`;
                spoken.push(item.title);
            }
            for (const line of item.lines ?? []) {
                if (typeof line === 'string') {
                    html += `<p>${escapeHtml(line)}</p>`;
                    spoken.push(line);
                } else if (line.rubric) {
                    html += `<p class="rubric">${escapeHtml(line.rubric)}</p>`; // instructions aren't read aloud
                } else {
                    html += `<p>${escapeHtml(line.text)} <span class="rubric">(${timesLabel(line.times)})</span></p>`;
                    for (let i = 0; i < line.times; i++) spoken.push(line.text); // said N times
                }
            }
            if (item.scripture) {
                const verses = await scriptureVerses(item.scripture);
                html += verses.map(v =>
                    `<p><sup>${escapeHtml(v.number)}</sup>${escapeHtml(v.text).replace(/\[([^\]]+)\]/g, '<i>$1</i>')}</p>`).join('');
                spoken.push(verses.map(v => v.text.replace(/[\[\]]/g, '')).join(' '));
            }
        }

        view.innerHTML = `
            <a class="back" href="#">‹ All prayers</a>
            <section class="card">
                <h2>${escapeHtml(section.title)}</h2>
                ${section.subtitle ? `<p class="rubric">${escapeHtml(section.subtitle)}</p>` : ''}
                ${section.note ? `<p class="rubric">${escapeHtml(section.note)}</p>` : ''}
                ${Listen.supported ? '<button type="button" class="listen" id="listen">🔊 Listen</button>' : ''}
                <div class="text">${html}</div>
            </section>`;
        window.scrollTo(0, 0);

        // Each part ends with a full stop, so the voice pauses between prayers.
        document.getElementById('listen')?.addEventListener('click', () =>
            Listen.play(section.title, spoken.map(part => /[.!?]$/.test(part) ? part : part + '.').join(' ')));
    }

    // ---- Choosing the view from the address ----
    async function route() {
        Listen.stop();
        try {
            if (!book) {
                book = await getJson('/data/prayers.json');
                document.getElementById('about').textContent = book.about;
            }
            const id = location.hash.slice(1);
            if (id) {
                await showSection(id);
            } else {
                showList();
            }
        } catch (error) {
            view.innerHTML = `<p class="error">${escapeHtml(error.message)}</p>`;
        }
    }

    window.addEventListener('hashchange', route);
    route();
</script>
</body>
</html>
