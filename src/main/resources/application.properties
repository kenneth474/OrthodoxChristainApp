# application.properties holds settings for the app, so we can change
# behaviour without editing Java code. Each line is "setting.name=value".

# The name Spring Boot shows in its startup logs.
spring.application.name=orthodoxapp

# The port the web server listens on. With 8080 you open http://localhost:8080
# If another program already uses 8080, change this number (e.g. to 8081).
# ${PORT:8080} means "the PORT environment variable if there is one, else 8080":
# hosting services like Render tell the app which port to use that way.
server.port=${PORT:8080}

# ---- Secret settings ----
# Google sign-in keys, email and text-message settings live in
# secrets.properties in the project folder. That file is listed in .gitignore,
# so it never goes to GitHub. "optional:" means the app still starts without it.
# Copy secrets.example.properties to secrets.properties to get started.
spring.config.import=optional:file:./secrets.properties

# ---- Database ----
# H2 keeps its data in the data/ folder (also ignored by Git), so accounts
# survive restarts. Delete that folder to start with an empty database.
spring.datasource.url=jdbc:h2:file:./data/orthodoxapp
spring.datasource.username=sa
spring.datasource.password=

# Create and update the tables automatically from our @Entity classes.
# Handy while developing; before going live we'll switch to versioned
# database migrations (Flyway), so changes are planned and repeatable.
spring.jpa.hibernate.ddl-auto=update

# Only use the database inside services, never while a page is being sent.
spring.jpa.open-in-view=false

# ---- Uploads (profile photos) ----
# The biggest file we accept. The account page shrinks photos before
# uploading, so real uploads are tiny; this just stops anything silly.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- Email timeouts ----
# Give up on the email server after 10 seconds (in milliseconds) instead of
# waiting forever, so a slow or blocked mail server shows an error rather
# than a page that never finishes loading. Only used once email is set up.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
