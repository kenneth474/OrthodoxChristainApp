# secrets.example.properties: a template for your secret settings.
#
# 1. Copy this file and name the copy secrets.properties (same folder).
# 2. Fill in only the sections you want. Everything is optional: with nothing
#    filled in, the app still works with email + password sign-in, and codes
#    are printed in the VS Code terminal instead of being sent.
# 3. Restart the app.
#
# secrets.properties is in .gitignore. NEVER put real keys in this example
# file, or anywhere else that gets committed to GitHub.

# ---- Sign in with Google (free) ----
# From Google Cloud Console > Google Auth Platform > Clients > Create client
# (type "Web application"). Add both "Authorized redirect URIs":
#     http://localhost:8080/login/oauth2/code/google          (this computer)
#     https://orthodox-daily.onrender.com/login/oauth2/code/google   (online)
# Online, the same two values go in Render > orthodox-daily > Environment as
# APP_AUTH_GOOGLE_CLIENTID and APP_AUTH_GOOGLE_CLIENTSECRET.
app.auth.google.client-id=
app.auth.google.client-secret=

# ---- Real emails (verification and sign-in codes) ----
# Example for Gmail: turn on 2-Step Verification for your Google account, then
# create an "App password" at https://myaccount.google.com/apppasswords
# and paste its 16 letters below without spaces (not your normal Gmail password).
# While spring.mail.password is empty, codes are still printed in the terminal.
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=you@gmail.com
#spring.mail.password=your-16-letter-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
#app.mail.from=Orthodox Daily <you@gmail.com>

# ---- Codes by text message, through Twilio Verify ----
# About $0.05 per successful verification plus about a cent per text (US).
# No phone number to buy and no carrier registration: Verify uses Twilio's own.
# From https://console.twilio.com: the Account SID and Auth Token (on the
# account's home page), and the Service SID of a Verify service you create
# (Verify > Services > Create, friendly name "Orthodox Daily").
# Online: APP_SMS_TWILIO_ACCOUNTSID, APP_SMS_TWILIO_AUTHTOKEN and
# APP_SMS_TWILIO_VERIFYSERVICESID in Render's Environment.
app.sms.twilio.account-sid=
app.sms.twilio.auth-token=
app.sms.twilio.verify-service-sid=
