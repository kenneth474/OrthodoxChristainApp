# secrets.example.properties: a template for your secret settings.
#
# 1. Copy this file and name the copy secrets.properties (same folder).
# 2. Fill in only the sections you want. Everything is optional: with nothing
#    filled in, the app still works with email + password sign-in, and codes
#    are printed in the VS Code terminal instead of being sent.
# 3. Restart the app.
#
# secrets.properties is in .gitignore. NEVER put real keys in this example
# file, or anywhere else that gets committed to GitHub.

# ---- Sign in with Google ----
# From Google Cloud Console > APIs & Services > Credentials > OAuth client ID
# (type "Web application"). Add this "Authorized redirect URI":
#     http://localhost:8080/login/oauth2/code/google
app.auth.google.client-id=
app.auth.google.client-secret=

# ---- Sign in with Apple ----
# Needs a paid Apple Developer account, and the app online at an https://
# address (Apple doesn't allow localhost). From developer.apple.com:
#   client-id         = your Services ID, e.g. org.example.orthodoxdaily.web
#   team-id           = your 10-character Team ID
#   key-id            = the Key ID of a "Sign in with Apple" key
#   private-key-file  = where you saved that key's AuthKey_XXXXXXXXXX.p8 file
# Return URL to register with Apple: https://YOUR-DOMAIN/login/oauth2/code/apple
app.auth.apple.client-id=
app.auth.apple.team-id=
app.auth.apple.key-id=
app.auth.apple.private-key-file=

# ---- Real emails (verification and sign-in codes) ----
# Example for Gmail: turn on 2-Step Verification for your Google account, then
# create an "App password" at https://myaccount.google.com/apppasswords
# and paste its 16 letters below without spaces (not your normal Gmail password).
# While spring.mail.password is empty, codes are still printed in the terminal.
#spring.mail.host=smtp.gmail.com
#spring.mail.port=587
#spring.mail.username=you@gmail.com
#spring.mail.password=your-16-letter-app-password
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
#app.mail.from=Orthodox Daily <you@gmail.com>

# ---- Real text messages, through Twilio (paid: about 1 cent per text) ----
# From https://console.twilio.com: Account SID, Auth Token and your Twilio number.
app.sms.twilio.account-sid=
app.sms.twilio.auth-token=
app.sms.twilio.from-number=
